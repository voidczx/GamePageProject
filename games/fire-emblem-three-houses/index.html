<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#111310">
  <meta name="description" content="火焰纹章 风花雪月无继承超难作战台：章节地图、角色培养、外传关联与路线规划。">
  <title>风花雪月 | 无继承超难作战台</title>
  <link rel="stylesheet" href="../../assets/css/guide-shell.css">
  <link rel="stylesheet" href="style.css">
  <script src="data.js" defer></script>
  <script src="app.js" defer></script>
</head>
<body>
  <a class="guide-home-link" href="../../" aria-label="返回攻略库">← 攻略库</a>

  <header class="app-header">
    <div class="brand-block">
      <span class="brand-code">FE3H / MADDENING</span>
      <strong>无继承超难作战台</strong>
    </div>
    <label class="global-search" for="global-search">
      <span>全局搜索</span>
      <input id="global-search" type="search" placeholder="角色、战技、外传、章节…" autocomplete="off">
    </label>
  </header>

  <div class="app-shell">
    <aside class="control-rail">
      <section class="control-group" aria-labelledby="route-label">
        <h2 id="route-label">当前路线</h2>
        <div class="route-switch" id="route-switch" role="group" aria-label="选择路线"></div>
      </section>

      <section class="control-group" aria-labelledby="chapter-label">
        <label id="chapter-label" for="chapter-select">当前章节</label>
        <select id="chapter-select"></select>
      </section>

      <nav class="view-nav" id="view-nav" aria-label="页面视图">
        <button class="active" data-view="command">本月作战</button>
        <button data-view="battles">战役地图</button>
        <button data-view="roster">角色编成</button>
        <button data-view="paralogues">外传关系</button>
        <button data-view="routes">路线节点</button>
        <button data-view="mechanics">机制速查</button>
      </nav>

      <section class="source-note">
        <span>DATA BASELINE</span>
        <p>Triangle Attack / FE Datamine；Maddening 数据与策略建议分栏显示，头像来自对应角色数据页。</p>
      </section>
    </aside>

    <main id="app" tabindex="-1"></main>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
</body>
</html>
