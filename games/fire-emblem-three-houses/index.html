const paralogues=[['弱者的战斗','杜笃','青狮','第一部','杜笃在队；青狮限定','杜笃后续剧情与奖励相关，青狮务必做。'],['真正的骑士道','菲利克斯','青狮','第一部','菲利克斯在队','奖励盾/资源，难点是保护 NPC 与分兵。'],['传说中的存在','洛廉兹','金鹿','第一部','洛廉兹在队；可挖角后开启','奖励 Thyrsus，法师全线顶级装备，优先做。'],['被诅咒的遗产','英谷莉特/多洛缇雅','青狮/黑鹫','第一部','通常相关角色之一在队可开启','奖励卢恩；注意飞兵与保护目标。'],['油断大敌','拉斐尔/伊古纳兹','金鹿','第一部','相关角色在队','奖励经验与资源，难度中等。'],['不共戴天','希尔妲/西提司','金鹿/教会','第二部','后半通常需两者都在队；路线限制','奖励弗莱库格，希尔妲核心遗产。'],['抹消英雄遗产','玛莉安奴','金鹿','第二部','玛莉安奴在队','奖励布鲁托刚格；魔兽较多，带破甲计策。'],['湖水传说','林哈尔特/蕾欧妮','黑鹫/金鹿','第二部','两者均在队','奖励弓/资源；魔兽高压，准备破盾。'],['异境天空','尤里/康斯坦洁','灰狼','DLC','DLC 通关并招募相关角色','奖励多罗米锁环等，机动工具价值极高。'],['金鹿之守护者','巴尔塔札尔/哈琵','灰狼','DLC','DLC 通关并招募相关角色','奖励瓦玖拉，拳系强装备。'],['不朽之守护者','西提司/芙莲','教会','第一部','二人在队','奖励卡aduceus 法杖，法师射程/恢复辅助好用。'],['海之见闻','萨米亚/阿罗伊斯','教会','第二部','二人在队','奖励资源和骑士团，敌人分布需稳扎稳打。']];
const sortie=[['前期总原则','敌方速度与伤害高，不追求全员均养；集中 8–10 人。用曲射、计策、连携、地形拉怪。'],['职业精通','物理优先土匪鬼神一击、弓箭手命中+20；女性高速拿飞马飞燕；法师拿术师魔神一击；治疗拿牧师。'],['计策','超难计策是控场核心。魅力低的角色装高命中骑士团；破魔兽盾前先看范围和连携。'],['第 13 章','无继承超难常见卡点。第一部结束前确保自动出场角色有等级、武器、骑士团和伤害手段。'],['外传','先做强奖励、会过期、低难窗口的外传。进入前检查胜利条件，很多图不是全灭最优。'],['飞行队','飞行无视地形但怕弓，警戒姿态+和高回避骑士团成型后可拉怪。'],['法师','射程杖、长程魔法和 Warp/Rescue 比面板更关键。保护站位，避免被增援骑兵秒杀。'],['装备','铁+/训练+性价比高；银+补伤；勇者系解决追击；必杀系配高技/必杀骑士团；遗产留给关键击杀。']];
const mechanics=[['战技获得方式','角色技能等级获得：如弓 D 曲射、枪 A 连击（部分角色）、剑 A 风薙（部分角色）。职业精通获得：如狙击手猎箭齐发。英雄遗产/专属武器附带：如阿姆尔狂岚、天帝之剑破天/天帝之霸剑。'],['特技获得方式','技能等级：各武器 Prowess、指挥、飞行 C+/A+ 警戒姿态。职业精通：土匪鬼神、弓箭手命中+20、术师魔神、飞马飞燕、佣兵待伏、勇士愤怒。'],['挖角判定','学生挖角通常看主角某项能力值 + 某技能等级；支援等级越高，门槛越低。部分角色有路线限制或不可挖。'],['DLC 灰狼','通关煤暗之章后，主线可在深渊招募尤里、巴尔塔札尔、康斯坦洁、哈琵；他们有自己的外传与装备。'],['外传触发','第一部外传多为相关角色之一在队即可；第二部多人外传常要求相关角色都在队，且有路线/月份限制。']];
const panels=[['overview','总览'],['byleth','主角'],['be','黑鹫'],['bl','青狮'],['gd','金鹿'],['dlc','DLC/教会'],['months','月份节点'],['paralogues','外传'],['sortie','出击'],['mechanics','机制速查']];
function card(c){return `<article class="card searchable" id="${c[0]}"><h3>${c[0]}</h3><div class="meta"><span class="tag">${c[1]}</span><span class="tag">挖角：${c[2]}</span><span class="tag warn">${c[3]}</span></div><div class="kv"><div class="k">职业路线</div><div>${c[4]}</div><div class="k">转职条件</div><div>${c[5]}</div><div class="k">战技获取</div><div>${c[6]}</div><div class="k">特技获取</div><div>${c[7]}</div><div class="k">装备获取</div><div>${c[8]}</div><div class="k">骑士团</div><div>${c[9]}</div><div class="k">注意</div><div>${c[10]}</div></div></article>`}
function charPanel(id,title,key){let list=chars[key]; return `<section class="panel" id="p-${id}"><div class="hero"><h1>${title}</h1><p class="note">无继承超难优先级以“命中、机动、职业精通、关键战技获得时间”为核心。手机端为卡片，桌面端双列。</p><div class="jump">${list.map(x=>`<a href="#${x[0]}">${x[0].split(' ')[0]}</a>`).join('')}</div></div><div class="cards">${list.map(card).join('')}</div></section>`}
function tablePanel(id,title,heads,rows){return `<section class="panel" id="p-${id}"><div class="hero"><h1>${title}</h1></div><div class="section"><table class="table"><thead><tr>${heads.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr class="searchable">${r.map((x,i)=>`<td data-label="${heads[i]}">${x}</td>`).join('')}</tr>`).join('')}</tbody></table></div></section>`}
let app=document.getElementById('app');
app.innerHTML=`<section class="panel active" id="p-overview"><div class="hero"><h1>使用方式</h1><p>这版删除勾选/备注/存档，优先做“手机可读的高密度速查”。顶部搜索会过滤当前页条目；左侧/横向导航可直达角色、月份、外传和机制。</p></div><div class="section"><h2>无继承超难核心原则</h2><div class="compactList">${sortie.concat(mechanics).map(x=>`<div class="mini searchable"><b>${x[0]}</b><br>${x[1]}</div>`).join('')}</div></div></section>`+
charPanel('byleth','主角培养｜青狮 & 金鹿补全','通用主角')+charPanel('be','黑鹫角色培养','黑鹫')+charPanel('bl','青狮角色培养','青狮')+charPanel('gd','金鹿角色培养','金鹿')+charPanel('dlc','DLC / 教会角色培养','DLC/教会')+
tablePanel('months','关键月份节点',['月份','节点与注意'],months)+tablePanel('paralogues','角色单人/多人外传',['外传','角色','原学级','时期','触发条件','奖励/注意'],paralogues)+tablePanel('sortie','主线/支线出击注意事项',['主题','注意事项'],sortie)+tablePanel('mechanics','战技/特技/挖角机制速查',['主题','说明'],mechanics);
let tabs=document.getElementById('tabs'); tabs.innerHTML=panels.map((p,i)=>`<button class="tab ${i==0?'active':''}" data-p="${p[0]}">${p[1]}</button>`).join('');
function activate(id){document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active',b.dataset.p==id));document.querySelectorAll('.panel').forEach(p=>p.classList.toggle('active',p.id=='p-'+id));buildSide(id);document.getElementById('q').value='';filter('');window.scrollTo({top:0,behavior:'smooth'})}
tabs.onclick=e=>{if(e.target.dataset.p)activate(e.target.dataset.p)};
function buildSide(id){let p=document.getElementById('p-'+id), links=[]; p.querySelectorAll('h1,h2,h3').forEach((h,i)=>{if(!h.id)h.id=id+'-h-'+i; links.push(`<a href="#${h.id}">${h.textContent}</a>`)}); document.getElementById('sideLinks').innerHTML=links.join('')||'<span class="note">无子项</span>'}buildSide('overview');
function filter(q){q=q.trim().toLowerCase();document.querySelectorAll('.panel.active .searchable').forEach(el=>{el.style.display=!q||el.textContent.toLowerCase().includes(q)?'':'none'})}
document.getElementById('q').oninput=e=>filter(e.target.value);
</script>
